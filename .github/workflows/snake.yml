name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FF7A45&color_dots=#ebedf0,#c7f5ec,#8beedb,#5EEAD4,#14b8a6
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF7A45&color_dots=#161b22,#0f3b3a,#11706a,#2bb5a3,#5EEAD4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
