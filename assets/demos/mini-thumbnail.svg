<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.a{animation:a 6s infinite}.b{animation:a 6s infinite 3s;opacity:0}@keyframes a{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// THUMBNAIL STUDIO</text>
    <rect x="80" y="52" width="240" height="135" rx="8" fill="#05070F" stroke="#22304F" stroke-width="2"/>
    <g class="a"><circle cx="260" cy="125" r="34" fill="#8B96AD" opacity=".7"/><rect x="100" y="80" width="110" height="18" rx="3" fill="#5EEAD4"/><rect x="100" y="106" width="80" height="18" rx="3" fill="#FF7A45"/></g>
    <g class="b"><circle cx="140" cy="125" r="34" fill="#8B96AD" opacity=".7"/><rect x="195" y="88" width="105" height="22" rx="3" fill="#FF7A45"/><rect x="195" y="118" width="70" height="14" rx="3" fill="#5EEAD4"/></g>
    <text class="mono" x="200" y="206" font-size="10" text-anchor="middle" fill="#8B96AD">style archetypes · consistent avatar</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
