    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// AKILLITEPSI · FOOD WASTE AI</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> TOP 100</text>
    <rect x="50" y="56" width="500" height="228" rx="22" fill="none" stroke="#8B96AD" stroke-width="2"/>
    <rect x="70" y="70" width="210" height="100" rx="16" fill="#1A2440" stroke="#22304F" stroke-width="2"/><ellipse class="m" cx="175.0" cy="120.0" rx="63.0" ry="28.000000000000004" fill="#5EEAD4" fill-opacity=".35" stroke="#5EEAD4" stroke-width="2" style="animation-delay:0.0s"/><rect x="300" y="70" width="230" height="100" rx="16" fill="#1A2440" stroke="#22304F" stroke-width="2"/><ellipse class="m" cx="415.0" cy="120.0" rx="69.0" ry="28.000000000000004" fill="#FF7A45" fill-opacity=".35" stroke="#FF7A45" stroke-width="2" style="animation-delay:0.6s"/><rect x="70" y="190" width="140" height="80" rx="16" fill="#1A2440" stroke="#22304F" stroke-width="2"/><ellipse class="m" cx="140.0" cy="230.0" rx="42.0" ry="22.400000000000002" fill="#5EEAD4" fill-opacity=".35" stroke="#5EEAD4" stroke-width="2" style="animation-delay:1.2s"/><rect x="230" y="190" width="140" height="80" rx="16" fill="#1A2440" stroke="#22304F" stroke-width="2"/><ellipse class="m" cx="300.0" cy="230.0" rx="42.0" ry="22.400000000000002" fill="#5EEAD4" fill-opacity=".35" stroke="#5EEAD4" stroke-width="2" style="animation-delay:1.7999999999999998s"/><rect x="390" y="190" width="140" height="80" rx="16" fill="#1A2440" stroke="#22304F" stroke-width="2"/><ellipse class="m" cx="460.0" cy="230.0" rx="42.0" ry="22.400000000000002" fill="#FF7A45" fill-opacity=".35" stroke="#FF7A45" stroke-width="2" style="animation-delay:2.4s"/>
