<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.o{opacity:0;animation:o 4s infinite}@keyframes o{0%,40%{opacity:0}55%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.o{opacity:1}}</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// JSONTOYOLO</text>
    <text class="mono" x="30" y="96" font-size="11" fill="#8B96AD">{ "label": "car",</text>
    <text class="mono" x="40" y="118" font-size="11" fill="#8B96AD">"points": [[412,</text>
    <text class="mono" x="40" y="140" font-size="11" fill="#8B96AD">218], ...] }</text>
    <path d="M180,118 H215" stroke="#FF7A45" stroke-width="2"/><path d="M209,112 l7,6 -7,6" fill="none" stroke="#FF7A45" stroke-width="2"/>
    <text class="mono o" x="230" y="100" font-size="11" fill="#5EEAD4" style="animation-delay:0.0s">0 0.512 0.418 0.120</text><text class="mono o" x="230" y="122" font-size="11" fill="#5EEAD4" style="animation-delay:0.25s">1 0.233 0.701 0.064</text><text class="mono o" x="230" y="144" font-size="11" fill="#5EEAD4" style="animation-delay:0.5s">2 0.804 0.297 0.151</text>
    <text class="mono" x="200" y="196" font-size="10" text-anchor="middle" fill="#8B96AD">Supervisely JSON → YOLOv8/v11 · GUI + CLI</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
