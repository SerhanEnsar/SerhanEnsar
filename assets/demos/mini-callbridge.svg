<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// CALLBRIDGE</text>
    <rect x="50" y="70" width="110" height="80" rx="8" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/>
    <text class="mono" x="105" y="168" font-size="10" text-anchor="middle" fill="#8B96AD">tablet · SIM</text>
    <rect x="270" y="58" width="56" height="104" rx="10" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/>
    <text class="sans" x="298" y="114" font-size="20" text-anchor="middle" fill="#5EEAD4">☏</text>
    <circle cx="298" cy="108" r="20" fill="none" stroke="#5EEAD4"><animate attributeName="r" values="18;40" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <path d="M165,110 H262" stroke="#22304F" stroke-width="2"/>
    <circle r="4" fill="#FF7A45"><animateMotion dur="1.4s" repeatCount="indefinite" path="M165,110 H262"/></circle>
    <text class="mono" x="298" y="190" font-size="10" text-anchor="middle" fill="#8B96AD">answer anywhere</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
