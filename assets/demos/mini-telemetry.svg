<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// SMART TELEMETRY</text>
    <circle cx="70" cy="115" r="30" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/><text class="mono" x="70" y="119" font-size="10" text-anchor="middle" fill="#5EEAD4">WearOS</text>
    <rect x="165" y="95" width="70" height="40" rx="4" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/><text class="mono" x="200" y="119" font-size="10" text-anchor="middle" fill="#E6EDF3">ESP32</text>
    <rect x="285" y="88" width="90" height="56" rx="4" fill="#05070F" stroke="#E6EDF3" stroke-width="2"/>
    <text class="mono" x="330" y="122" font-size="16" text-anchor="middle" fill="#FF7A45">72 <tspan font-size="9" fill="#8B96AD">bpm</tspan></text>
    <path d="M100,115 H160 M240,115 H280" stroke="#22304F" stroke-width="2"/>
    <circle r="4" fill="#5EEAD4"><animateMotion dur="1s" repeatCount="indefinite" path="M100,115 H160 L240,115 H280"/></circle>
    <text class="mono" x="200" y="190" font-size="10" text-anchor="middle" fill="#8B96AD">Nextion HMI · live at 1 Hz</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
