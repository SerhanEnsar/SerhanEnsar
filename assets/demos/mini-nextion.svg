<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.l2{opacity:0;animation:l2 5s infinite}@keyframes l2{0%,45%{opacity:0}50%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.l2{opacity:1}}</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// NEXTION-EDITOR-LINUX</text>
    <rect x="30" y="52" width="340" height="140" rx="8" fill="#05070F" stroke="#22304F" stroke-width="2"/>
    <circle cx="46" cy="66" r="4" fill="#FF7A45"/><circle cx="60" cy="66" r="4" fill="#8B96AD"/><circle cx="74" cy="66" r="4" fill="#8B96AD"/>
    <text class="mono" x="46" y="104" font-size="13" fill="#E6EDF3"><tspan fill="#5EEAD4">$</tspan> ./install.sh<tspan class="blink" fill="#5EEAD4">▍</tspan></text>
    <text class="mono l2" x="46" y="132" font-size="12" fill="#8B96AD">wine prefix ready</text>
    <text class="mono l2" x="46" y="156" font-size="12" fill="#5EEAD4" style="animation-delay:.6s">✓ Nextion Editor running on Ubuntu</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
