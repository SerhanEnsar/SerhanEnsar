    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// FRETRUM · IN PROGRESS</text>
    <line x1="70" y1="74" x2="70" y2="156" stroke="#22304F" stroke-width="2"/><line x1="112" y1="74" x2="112" y2="156" stroke="#22304F" stroke-width="2"/><line x1="154" y1="74" x2="154" y2="156" stroke="#22304F" stroke-width="2"/><line x1="196" y1="74" x2="196" y2="156" stroke="#22304F" stroke-width="2"/><line x1="238" y1="74" x2="238" y2="156" stroke="#22304F" stroke-width="2"/><line x1="40" y1="80" x2="250" y2="80" stroke="#8B96AD" stroke-width="1.0"/><line x1="40" y1="94" x2="250" y2="94" stroke="#8B96AD" stroke-width="1.3"/><line x1="40" y1="108" x2="250" y2="108" stroke="#8B96AD" stroke-width="1.6"/><line x1="40" y1="122" x2="250" y2="122" stroke="#8B96AD" stroke-width="1.9"/><line x1="40" y1="136" x2="250" y2="136" stroke="#8B96AD" stroke-width="2.2"/><line x1="40" y1="150" x2="250" y2="150" stroke="#8B96AD" stroke-width="2.5"/>
    <path stroke="#5EEAD4" stroke-width="2" fill="none"><animate attributeName="d" values="M40,122 Q145,116 250,122;M40,122 Q145,128 250,122;M40,122 Q145,116 250,122" dur=".18s" repeatCount="indefinite"/></path>
    <circle cx="112" cy="108" r="6" fill="#FF7A45"/>
    <path d="M290,150 A50,50 0 0 1 370,150" fill="none" stroke="#22304F" stroke-width="2"/>
    <line x1="330" y1="150" x2="330" y2="112" stroke="#5EEAD4" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" values="-25 330 150;8 330 150;-3 330 150;0 330 150" dur="3s" repeatCount="indefinite"/></line>
    <text class="mono" x="330" y="172" font-size="11" text-anchor="middle" fill="#5EEAD4">E</text>
