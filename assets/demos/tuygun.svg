<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bb{opacity:0;animation:bb 6s infinite}@keyframes bb{0%{opacity:0}8%,80%{opacity:1}90%,100%{opacity:0}}.vo{stroke-dasharray:420;animation:draw 6s linear infinite}@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.bb{opacity:1}}</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// TUYGUN &amp; LAÇİN · AERIAL AI</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> TEKNOFEST 2026</text>
    <rect x="30" y="56" width="290" height="220" rx="10" fill="#101A33" stroke="#22304F"/>
    <path d="M30,140 H320 M150,56 V276" stroke="#22304F" stroke-width="14"/>
    <rect x="76" y="96" width="34" height="18" rx="3" fill="#8B96AD" opacity=".6"/><rect x="116" y="206" width="38" height="20" rx="3" fill="#8B96AD" opacity=".6"/>
    <circle cx="201" cy="186" r="6" fill="#8B96AD" opacity=".7"/><circle cx="250" cy="100" r="14" fill="none" stroke="#8B96AD" stroke-width="3" opacity=".7"/>
    <g class="bb" style="animation-delay:0.0s"><rect x="70" y="90" width="46" height="30" fill="none" stroke="#5EEAD4" stroke-width="2"/><rect x="70" y="76" width="57" height="13" fill="#5EEAD4"/><text class="mono" x="74" y="86" font-size="10" fill="#05070F">vehicle</text></g><g class="bb" style="animation-delay:0.7s"><rect x="190" y="170" width="22" height="34" fill="none" stroke="#5EEAD4" stroke-width="2"/><rect x="190" y="156" width="50" height="13" fill="#5EEAD4"/><text class="mono" x="194" y="166" font-size="10" fill="#05070F">person</text></g><g class="bb" style="animation-delay:1.4s"><rect x="110" y="200" width="50" height="32" fill="none" stroke="#5EEAD4" stroke-width="2"/><rect x="110" y="186" width="57" height="13" fill="#5EEAD4"/><text class="mono" x="114" y="196" font-size="10" fill="#05070F">vehicle</text></g><g class="bb" style="animation-delay:2.1s"><rect x="230" y="80" width="40" height="40" fill="none" stroke="#FF7A45" stroke-width="2"/><rect x="230" y="66" width="29" height="13" fill="#FF7A45"/><text class="mono" x="234" y="76" font-size="10" fill="#05070F">UAP</text></g>
    <text class="mono" x="350" y="70" font-size="11" fill="#8B96AD">visual odometry · GPS lost</text>
    <rect x="350" y="80" width="220" height="196" rx="10" fill="#101A33" stroke="#22304F"/>
    <path d="M370,250 C410,200 430,230 470,170 S540,120 550,100" fill="none" stroke="#8B96AD" stroke-width="2" stroke-dasharray="4 5"/>
    <path class="vo" d="M370,250 C412,204 428,226 472,174 S536,118 548,104" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
    <text class="mono" x="365" y="100" font-size="10" fill="#8B96AD">--- ground truth</text><text class="mono" x="470" y="100" font-size="10" fill="#5EEAD4">— estimate</text>
