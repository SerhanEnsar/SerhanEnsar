<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// LABELFORGE</text>
    <rect x="30" y="56" width="200" height="140" rx="8" fill="#101A33" stroke="#22304F"/>
    <rect x="70" y="96" width="0" height="0" fill="#5EEAD4" fill-opacity=".15" stroke="#5EEAD4" stroke-width="2">
      <animate attributeName="width" values="0;90;90" keyTimes="0;.5;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;60;60" keyTimes="0;.5;1" dur="3s" repeatCount="indefinite"/></rect>
    <circle cx="262" cy="86" r="5" fill="#5EEAD4"/><text class="mono" x="274" y="90" font-size="11" fill="#E6EDF3">vehicle</text><circle cx="262" cy="110" r="5" fill="#5EEAD4"/><text class="mono" x="274" y="114" font-size="11" fill="#E6EDF3">person</text><circle cx="262" cy="134" r="5" fill="#FF7A45"/><text class="mono" x="274" y="138" font-size="11" fill="#E6EDF3">UAP</text><circle cx="262" cy="158" r="5" fill="#FF7A45"/><text class="mono" x="274" y="162" font-size="11" fill="#E6EDF3">UAI</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
