<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// UNILATE · STUDENT CO-PILOT</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> CLOSED BETA</text>
    <rect x="210" y="52" width="180" height="240" rx="26" fill="#05070F" stroke="#E6EDF3" stroke-opacity=".6" stroke-width="2.5"/>
    <rect x="275" y="60" width="50" height="6" rx="3" fill="#8B96AD" opacity=".5"/>
    <text class="sans" x="232" y="88" font-size="13" font-weight="800" fill="#5EEAD4">Absence room</text>
    <text class="sans" x="232" y="112" font-size="12" fill="#E6EDF3">Signals</text><rect x="232" y="120" width="136" height="6" rx="3" fill="#22304F"/><rect x="232" y="120" width="0" height="6" rx="3" fill="#5EEAD4"><animate attributeName="width" values="0;61;61" keyTimes="0;.4;1" dur="5s" begin="0.0s" repeatCount="indefinite"/></rect><text class="sans" x="232" y="154" font-size="12" fill="#E6EDF3">Physics II</text><rect x="232" y="162" width="136" height="6" rx="3" fill="#22304F"/><rect x="232" y="162" width="0" height="6" rx="3" fill="#FF7A45"><animate attributeName="width" values="0;122;122" keyTimes="0;.4;1" dur="5s" begin="0.3s" repeatCount="indefinite"/></rect><text class="sans" x="232" y="196" font-size="12" fill="#E6EDF3">Algorithms</text><rect x="232" y="204" width="136" height="6" rx="3" fill="#22304F"/><rect x="232" y="204" width="0" height="6" rx="3" fill="#5EEAD4"><animate attributeName="width" values="0;41;41" keyTimes="0;.4;1" dur="5s" begin="0.6s" repeatCount="indefinite"/></rect><text class="sans" x="232" y="238" font-size="12" fill="#E6EDF3">Calculus</text><rect x="232" y="246" width="136" height="6" rx="3" fill="#22304F"/><rect x="232" y="246" width="0" height="6" rx="3" fill="#5EEAD4"><animate attributeName="width" values="0;82;82" keyTimes="0;.4;1" dur="5s" begin="0.8999999999999999s" repeatCount="indefinite"/></rect>
    <text class="mono" x="40" y="140" font-size="11" fill="#8B96AD">offline-first</text>
    <text class="mono" x="40" y="160" font-size="11" fill="#8B96AD">no account</text>
    <text class="mono" x="40" y="180" font-size="11" fill="#8B96AD">no backend</text>
    <text class="mono" x="560" y="160" font-size="11" text-anchor="end" fill="#FF7A45">⚠ near limit</text>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
