<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// N8N DEEP SCRAPER</text>
    <path d="M94,112 H116 M184,112 H206 M274,112 H296" stroke="#22304F" stroke-width="2"/>
    <rect x="26" y="92" width="68" height="40" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/><text class="mono" x="60" y="116" font-size="11" text-anchor="middle" fill="#E6EDF3">scrape</text><rect x="116" y="92" width="68" height="40" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/><text class="mono" x="150" y="116" font-size="11" text-anchor="middle" fill="#E6EDF3">parse</text><rect x="206" y="92" width="68" height="40" rx="10" fill="#0B1226" stroke="#FF7A45" stroke-width="2"/><text class="mono" x="240" y="116" font-size="11" text-anchor="middle" fill="#E6EDF3">LLM</text><rect x="296" y="92" width="68" height="40" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/><text class="mono" x="330" y="116" font-size="11" text-anchor="middle" fill="#E6EDF3">JSON</text>
    <circle r="4" fill="#5EEAD4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M60,150 H330"/></circle>
    <path d="M60,150 H330" stroke="#22304F" stroke-dasharray="3 5"/>
    <text class="mono" x="200" y="192" font-size="10" text-anchor="middle" fill="#8B96AD">paginated startup news → structured data</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
