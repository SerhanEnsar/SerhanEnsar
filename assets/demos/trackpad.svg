<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.rip{animation:rip 2.4s ease-out infinite;transform-origin:250px 170px}@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(2.6);opacity:0}}</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// TRACKPADPROMAX · FORCE TOUCH</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> macOS</text>
    <rect x="70" y="70" width="360" height="200" rx="18" fill="#1A2440" stroke="#22304F" stroke-width="2"/>
    <circle class="rip" cx="250" cy="170" r="22" fill="none" stroke="#5EEAD4" stroke-width="2"/>
    <circle class="rip" cx="250" cy="170" r="22" fill="none" stroke="#5EEAD4" stroke-width="2" style="animation-delay:.8s"/>
    <circle cx="250" cy="170" r="16" fill="#5EEAD4" opacity=".9"><animate attributeName="r" values="12;18;12" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="mono" x="470" y="82" font-size="11" fill="#8B96AD">force</text>
    <rect x="476" y="92" width="22" height="170" rx="11" fill="#22304F"/>
    <rect x="476" y="92" width="22" height="170" rx="11" fill="#FF7A45"><animate attributeName="height" values="20;170;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="242;92;242" dur="2.4s" repeatCount="indefinite"/></rect>
    <text class="mono" x="512" y="100" font-size="10" fill="#FF7A45">deep</text><text class="mono" x="512" y="260" font-size="10" fill="#8B96AD">light</text>
    <text class="mono" x="70" y="292" font-size="10" fill="#8B96AD">pressure gestures · custom taps · haptics</text>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
