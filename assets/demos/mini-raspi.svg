<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// RASPI 5 TOOLKIT</text>
    <rect x="40" y="70" width="120" height="84" rx="6" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/>
    <rect x="60" y="90" width="34" height="34" fill="#05070F"/><circle cx="130" cy="84" r="3" fill="#FF7A45" class="pulse"/>
    <path d="M44,74 h112" stroke="#8B96AD" stroke-dasharray="2 3"/>
    <rect x="240" y="70" width="130" height="84" rx="6" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/>
    <text class="mono" x="305" y="117" font-size="11" text-anchor="middle" fill="#5EEAD4">GNOME · RDP</text>
    <path d="M165,112 H235" stroke="#22304F" stroke-width="2"/>
    <circle r="4" fill="#5EEAD4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M165,112 H235"/></circle>
    <text class="mono" x="200" y="196" font-size="10" text-anchor="middle" fill="#8B96AD">headless setup · one-click Mac launcher</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
