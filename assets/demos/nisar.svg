<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bar{animation:drop 6s ease-in-out infinite;transform-origin:0 250px}@keyframes drop{0%,30%{transform:scaleY(1)}55%,100%{transform:scaleY(.62)}}</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// NISAR · RADAR TIME MACHINE</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> GLOBAL NOMINEE</text>
    <defs><clipPath id="g"><circle cx="170" cy="160" r="95"/></clipPath>
    <radialGradient id="gl" cx=".35" cy=".35"><stop offset="0" stop-color="#1E3A5F"/><stop offset="1" stop-color="#05070F"/></radialGradient>
    <path id="orb" d="M60,200 A120,40 -20 1,1 280,120 A120,40 -20 1,1 60,200"/></defs>
    <circle cx="170" cy="160" r="95" fill="url(#gl)" stroke="#22304F" stroke-width="2"/>
    <g clip-path="url(#g)" fill="none" stroke="#5EEAD4" stroke-opacity=".25">
      <ellipse cx="170" cy="160" rx="95" ry="30"/><ellipse cx="170" cy="160" rx="95" ry="65"/>
      <ellipse cx="170" cy="160" rx="30" ry="95"><animate attributeName="rx" values="0;95;0" dur="8s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="170" cy="160" rx="65" ry="95"/><line x1="75" y1="160" x2="265" y2="160"/>
    </g>
    <circle cx="200" cy="135" r="6" fill="#FF7A45"/><circle class="pulse" cx="200" cy="135" r="14" fill="none" stroke="#FF7A45"/>
    <use href="#orb" fill="none" stroke="#E6EDF3" stroke-opacity=".25" stroke-dasharray="3 6"/>
    <g><rect x="-6" y="-3" width="12" height="6" fill="#E6EDF3"/><rect x="-16" y="-1.5" width="8" height="3" fill="#5EEAD4"/><rect x="8" y="-1.5" width="8" height="3" fill="#5EEAD4"/>
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion></g>
    <text class="mono" x="340" y="78" font-size="11" fill="#8B96AD">HV backscatter · burned forest</text>
    <line x1="340" y1="250" x2="560" y2="250" stroke="#22304F" stroke-width="2"/>
    <rect x="360" y="110" width="50" height="140" rx="4" fill="#8B96AD" opacity=".5"/>
    <rect class="bar" x="450" y="110" width="50" height="140" rx="4" fill="#5EEAD4"/>
    <text class="mono" x="385" y="270" font-size="11" text-anchor="middle" fill="#8B96AD">before</text>
    <text class="mono" x="475" y="270" font-size="11" text-anchor="middle" fill="#5EEAD4">after</text>
    <text class="sans" x="475" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#E6EDF3">≈ −5 dB</text>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
