<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.scene{animation:sc 8s ease-in-out infinite}@keyframes sc{0%,10%{transform:translateY(0)}45%,55%{transform:translateY(-120px)}90%,100%{transform:translateY(0)}}.thumb{animation:th 8s ease-in-out infinite}@keyframes th{0%,10%{transform:translateY(0)}45%,55%{transform:translateY(110px)}90%,100%{transform:translateY(0)}}</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// SERHANENSAR.ME · SCROLL ENGINE</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> NEXT.JS</text>
    <defs><clipPath id="win"><rect x="60" y="78" width="480" height="196"/></clipPath></defs>
    <rect x="60" y="56" width="480" height="218" rx="10" fill="#05070F" stroke="#22304F" stroke-width="2"/>
    <circle cx="78" cy="67" r="4" fill="#FF7A45"/><circle cx="92" cy="67" r="4" fill="#8B96AD"/><circle cx="106" cy="67" r="4" fill="#8B96AD"/>
    <text class="mono" x="300" y="71" font-size="10" text-anchor="middle" fill="#8B96AD">serhanensar.me</text>
    <g clip-path="url(#win)"><g class="scene">
      <circle cx="400" cy="160" r="48" fill="#C3CAD8"/><circle cx="385" cy="148" r="9" fill="#8B96AD" opacity=".5"/>
      <text class="sans" x="90" y="150" font-size="24" font-weight="800" fill="#E6EDF3">Journey to</text>
      <text class="sans" x="90" y="180" font-size="24" font-weight="800" fill="#5EEAD4">the Moon</text>
      <rect x="90" y="270" width="180" height="90" rx="8" fill="#1A2440" stroke="#5EEAD4" stroke-opacity=".6"/>
      <rect x="110" y="290" width="50" height="34" fill="none" stroke="#FF7A45" stroke-width="2"/>
      <text class="mono" x="300" y="300" font-size="11" fill="#8B96AD">live ONNX detection</text>
      <text class="mono" x="300" y="320" font-size="11" fill="#8B96AD">in your browser</text>
    </g></g>
    <rect x="528" y="84" width="4" height="184" rx="2" fill="#22304F"/>
    <rect class="thumb" x="528" y="84" width="4" height="60" rx="2" fill="#5EEAD4"/>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
