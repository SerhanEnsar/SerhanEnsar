<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// PREXTREME</text>
    <text class="mono" x="40" y="96" font-size="12" fill="#8B96AD"><tspan fill="#FF7A45">public class</tspan> Main {</text>
    <text class="mono" x="60" y="118" font-size="12" fill="#8B96AD">// greedy + next-pos table</text>
    <text class="mono" x="40" y="140" font-size="12" fill="#8B96AD">}</text>
    <text class="mono" x="270" y="92" font-size="11" fill="#8B96AD">judge</text>
    <rect x="270" y="102" width="100" height="10" rx="5" fill="#22304F"/>
    <rect x="270" y="102" width="0" height="10" rx="5" fill="#5EEAD4"><animate attributeName="width" values="0;100;100" keyTimes="0;.6;1" dur="3s" repeatCount="indefinite"/></rect>
    <text class="sans" x="370" y="140" font-size="18" font-weight="800" text-anchor="end" fill="#E6EDF3">100</text>
    <text class="mono" x="200" y="196" font-size="10" text-anchor="middle" fill="#8B96AD">IEEEXtreme-style problems in Java</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
