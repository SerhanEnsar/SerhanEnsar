<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// HOMEAGENT · ONE HUB, FOUR SCREENS</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> SELF-HOSTED</text>
    <path d="M300,165 L110,95" stroke="#22304F" stroke-width="2"/><circle r="4" fill="#5EEAD4"><animateMotion dur="2s" begin="0.0s" repeatCount="indefinite" path="M300,165 L110,95"/></circle><rect x="62" y="77" width="96" height="36" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-opacity=".7"/><text class="mono" x="110" y="99" font-size="11" text-anchor="middle" fill="#E6EDF3">web</text><path d="M300,165 L490,95" stroke="#22304F" stroke-width="2"/><circle r="4" fill="#5EEAD4"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M300,165 L490,95"/></circle><rect x="442" y="77" width="96" height="36" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-opacity=".7"/><text class="mono" x="490" y="99" font-size="11" text-anchor="middle" fill="#E6EDF3">telegram</text><path d="M300,165 L110,240" stroke="#22304F" stroke-width="2"/><circle r="4" fill="#5EEAD4"><animateMotion dur="2s" begin="1.0s" repeatCount="indefinite" path="M300,165 L110,240"/></circle><rect x="62" y="222" width="96" height="36" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-opacity=".7"/><text class="mono" x="110" y="244" font-size="11" text-anchor="middle" fill="#E6EDF3">ESP32-S3</text><path d="M300,165 L490,240" stroke="#22304F" stroke-width="2"/><circle r="4" fill="#5EEAD4"><animateMotion dur="2s" begin="1.5s" repeatCount="indefinite" path="M300,165 L490,240"/></circle><rect x="442" y="222" width="96" height="36" rx="10" fill="#0B1226" stroke="#5EEAD4" stroke-opacity=".7"/><text class="mono" x="490" y="244" font-size="11" text-anchor="middle" fill="#E6EDF3">Wear OS</text>
    <rect x="250" y="130" width="100" height="70" rx="12" fill="#05070F" stroke="#FF7A45" stroke-width="2.5"/>
    <text class="sans" x="300" y="162" font-size="14" font-weight="800" text-anchor="middle" fill="#E6EDF3">Pi 5 hub</text>
    <text class="mono" x="300" y="182" font-size="10" text-anchor="middle" fill="#8B96AD">FastAPI · Gemini</text>
