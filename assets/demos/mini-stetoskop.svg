<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset=".55" stop-color="#0B1226"/><stop offset="1" stop-color="#121B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="220" rx="22"/></clipPath>
    
  </defs>
  <style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.car{animation:car 6s ease-in-out infinite}@keyframes car{0%,25%{transform:translateX(0)}35%,60%{transform:translateX(-90px)}70%,100%{transform:translateX(0)}}</style>
  <g clip-path="url(#card)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <text class="mono" x="20" y="30" font-size="11" letter-spacing="1.2" fill="#5EEAD4">// STETOSKOP AKADEMİ</text><defs><clipPath id="cv"><rect x="20" y="50" width="360" height="150"/></clipPath></defs>
    <g clip-path="url(#cv)"><g class="car"><rect x="60" y="78" width="70" height="96" rx="8" fill="#0B1226" stroke="#22304F" stroke-width="2"/><circle cx="95.0" cy="114.48" r="12.6" fill="#8B96AD" opacity=".6"/><rect x="155" y="64" width="90" height="124" rx="8" fill="#0B1226" stroke="#5EEAD4" stroke-width="2"/><circle cx="200.0" cy="111.12" r="16.2" fill="#8B96AD" opacity=".6"/><rect x="270" y="78" width="70" height="96" rx="8" fill="#0B1226" stroke="#22304F" stroke-width="2"/><circle cx="305.0" cy="114.48" r="12.6" fill="#8B96AD" opacity=".6"/><rect x="365" y="78" width="70" height="96" rx="8" fill="#0B1226" stroke="#22304F" stroke-width="2"/><circle cx="400.0" cy="114.48" r="12.6" fill="#8B96AD" opacity=".6"/></g></g>
    <text class="mono" x="200" y="206" font-size="10" text-anchor="middle" fill="#8B96AD">zero dependencies · freelance · delivered</text>
  </g>
  <rect x="1" y="1" width="398" height="218" rx="21" fill="none" stroke="#22304F" stroke-width="2"/>
</svg>
