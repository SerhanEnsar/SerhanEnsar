    <text class="mono" x="26" y="36" font-size="12" letter-spacing="1.5" fill="#5EEAD4">// ECOSYSTEM-CONNECTOR · ONE MESH</text><text class="mono" x="574" y="36" font-size="11" text-anchor="end" fill="#8B96AD"><tspan class="pulse" fill="#FF7A45">●</tspan> RUST</text>
    <path d="M150,130 L450,130" stroke="#22304F" stroke-width="2"/><circle r="5" fill="#5EEAD4"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite" path="M150,130 L450,130"/></circle><path d="M450,130 L300,240" stroke="#22304F" stroke-width="2"/><circle r="5" fill="#FF7A45"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M450,130 L300,240"/></circle><path d="M300,240 L150,130" stroke="#22304F" stroke-width="2"/><circle r="5" fill="#5EEAD4"><animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite" path="M300,240 L150,130"/></circle>
    <g transform="translate(150,130)"><rect x="-46" y="-32" width="92" height="58" rx="6" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/><rect x="-58" y="26" width="116" height="8" rx="3" fill="#E6EDF3" opacity=".7"/></g>
    <g transform="translate(450,130)"><rect x="-50" y="-34" width="100" height="62" rx="5" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/><rect x="-6" y="28" width="12" height="12" fill="#E6EDF3" opacity=".7"/><rect x="-24" y="40" width="48" height="5" rx="2" fill="#E6EDF3" opacity=".7"/></g>
    <g transform="translate(300,240)"><rect x="-17" y="-32" width="34" height="62" rx="7" fill="#0B1226" stroke="#E6EDF3" stroke-width="2"/></g>
